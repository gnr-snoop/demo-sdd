[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "face-insight"
version = "0.1.0"
description = "Face Insight Demo backend (Fase 1 skeleton)."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "pydantic>=2.5",
    "pydantic-settings>=2.1",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "asyncpg>=0.29",
    "psycopg[binary]>=3.1",
    "structlog>=24.1",
    "httpx>=0.27",
    "python-multipart>=0.0.9",
    "Pillow>=10.0",
    "itsdangerous>=2.1",
    # Spec 008 (FR-014): concrete ML adapter runtime deps. Imported only by
    # adapters/ml/* (FR-013/FR-014 — never by the domain or mock wiring path).
    "opencv-python-headless>=4.8",
    "onnxruntime>=1.16",
    "numpy>=1.24",
    # Spec 009 (FR-013/R-9): concrete mood/age adapter runtime deps. Imported
    # ONLY by adapters/ml/emotieff_mood.py and adapters/ml/mivolo_age.py — never
    # by the domain, mock wiring, or the other adapters/ml modules (FR-012).
    # torch is the CPU build (no CUDA) — install via the CPU index in the
    # container (Constitution Quality Gate §7 — no GPU to develop/test).
    "torch>=2.1",
    "timm==0.8.13.dev0",
    "hsemotion-onnx>=0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
    "black>=24.3",
]
test = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "testcontainers>=4.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-v"
markers = [
    # Spec 008 (FR-015, R-6): real-model integration tests. Skipped via an
    # autouse guard when model files are absent OR APP_MODE != "production"
    # (Constitution Quality Gate §7 — CI without models stays green).
    "requires_models: requires real ML model files in models/ and APP_MODE=production",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.black]
line-length = 100
target-version = ["py311"]
